[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowing-where"
version = "0.3.0"
description = "Context preparation, uncertainty diagnostics, and source-fusion experiments"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.50,<2", "pandas>=1.5,<3", "altair>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]
